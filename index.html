<script>try {
const {
  useState,
  useEffect,
  useRef
} = React;

// ── Palette: baize green / chalk blue / cue-tip / bone white ──
// ── Theme: charcoal black / mint green / cue gold / bone — matches rehab tracker ──
const C = {
  // backgrounds (was baize greens → near-black charcoal)
  baize: "#0F0F11",
  baizeDeep: "#0A0A0C",
  felt: "#171719",
  panel: "#161618",
  // card fill
  panelSoft: "rgba(255,255,255,0.025)",
  // nested insets
  // primary accent — mint green (progress, active, success, positive)
  chalk: "#3FB985",
  // medium mint, for active fills
  chalkSoft: "#5EE2A0",
  // bright mint, for accents/text
  ok: "#5EE2A0",
  okDeep: "#2E7D5A",
  // secondary accent — cue gold (snooker identity touches)
  cue: "#D9B26A",
  cueDim: "#9C8550",
  // text
  bone: "#ECEAE3",
  boneDim: "#8E8E88",
  // lines + states
  line: "rgba(255,255,255,0.08)",
  red: "#C75B43"
};
const TODAY = () => new Date().toISOString().slice(0, 10);
const uid = () => `s_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;

// What you measure — chosen to NOT pull attention off the cue ball mid-frame.
// All logged AFTER the session, from feel + a few countable facts.
const FOCUS_FIELDS = [{
  key: "natural",
  label: "Natural flow",
  hint: "Effortless vs. forced",
  type: "scale"
}, {
  key: "longpot",
  label: "Long pot %",
  hint: "Of attempted long pots",
  type: "pct",
  optional: true
}, {
  key: "safety",
  label: "Cue ball control",
  hint: "Ending where you wanted",
  type: "scale"
}];
const BREAK_FIELDS = [{
  key: "highBreak",
  label: "Highest break",
  hint: "Best run this session",
  type: "num"
}, {
  key: "fifties",
  label: "50+ breaks",
  hint: "Count of breaks over 50",
  type: "num"
}, {
  key: "centuries",
  label: "Centuries",
  hint: "100+ breaks",
  type: "num"
}];
const blankSession = () => ({
  id: uid(),
  date: TODAY(),
  duration: 60,
  mode: "solo",
  // solo | match
  venue: "",
  // where — lets trends separate table conditions from form
  tableQ: 0,
  // table quality 1–5, 0 = unrated
  // ── 激進地感受白波 — the spirit. Read it every session, before anything else.
  // Two hours of rubbish and frustration, close to hating the game. Turning
  // this on — fiercely wanting to feel the white, no matter what — is what
  // brought back the enjoyment and a level worth accepting. It outranks every
  // technique here because the same switch carries off the table too, into
  // connecting with people and with the ones you love. ──
  fierceConnect: false,
  // ── 起手離遠啲 — the shoulder guard. Above everything, because this one is
  // about not getting hurt. Addressing the white with the tip already on its
  // edge is what strains the left shoulder; start with a gap and close it
  // gradually over the first few featherings. ──
  addressGap: false,
  // ── 優皮士 rhythm — the wrist grip on the final delivery. Tops the scores. ──
  // The feeling in the gripping hand as the cue goes through the white: 慢,
  // 有感知, in rhythm. Deploying this is what first produced 10+ in 綠啡黃連環.
  yuppieRhythm: 7,
  // ── 手腕發力法 — the engine, directly under the rhythm. ──
  // All power and all cue-ball feel come from flicking the wrist into the white.
  // Calibrate the benchmark at 開枱, then every shot is a chosen % of it.
  wristBenchmark: false,
  // 開枱: max force each hand, up and down the table, trajectory straight = 100%
  wristPerShot: false,

  },

};

`;

  const rootEl = document.getElementById("root");
